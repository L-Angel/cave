name: Feature request
description: Suggest a new feature or datasource capability
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: datasource
    attributes:
      label: Datasource
      options:
        - Elasticsearch
        - MongoDB
        - MySQL / JDBC
        - Parser / CQL syntax
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include CQL examples and expected behavior if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This feature does not exist in the current support matrix (README).
          required: true
        - label: I have searched existing issues for duplicates.
          required: true

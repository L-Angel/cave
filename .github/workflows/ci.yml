name: CI

on:
  push:
    branches: [main, dev_ai]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify wrapper
        run: ./mvnw -v

      - name: Run offline tests
        run: ./mvnw -B -ntp test

      - name: Package
        run: ./mvnw -B -ntp -DskipTests package

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk-${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  mysql-integration:
    name: MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run MySQL integration test
        run: >-
          ./mvnw -B -ntp -Pintegration-tests
          -Dtest=MySqlIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Annotate MySQL test failures
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'cave-components/cave-sql/target/surefire-reports';
            let emitted = 0;
            if (fs.existsSync(root)) {
              for (const file of fs.readdirSync(root)) {
                if (!file.endsWith('.txt')) continue;
                const text = fs.readFileSync(path.join(root, file), 'utf8');
                const marker = text.indexOf('Caused by:');
                const detail = marker >= 0
                  ? text.slice(marker, marker + 8000)
                  : text.slice(0, 8000);
                core.error(detail, { title: file });
                emitted++;
                if (emitted >= 3) break;
              }
            }
            if (emitted === 0) {
              core.error('No surefire report found; inspect the Testcontainers/container logs in the job output.');
            }
